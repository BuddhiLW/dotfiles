# Read by ~/.local/bin/blw/screen-layout on every xmonad start (M-S-r).
# Left to right, as the screens sit on the desk. Names are xrandr outputs;
# "panel" is the laptop screen. Unplugged names are skipped.
order = HDMI-0 panel DP-0
# Vertical alignment of screens of different heights: top | center | bottom
align = center
