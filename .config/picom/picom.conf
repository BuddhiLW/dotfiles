#################################
# Improved picom.conf for Smooth Animations
#################################

# ------------------------------
# Blur settings
# ------------------------------
blur: {
    method = "dual_kawase";
    strength = 5;
}

# ------------------------------
# Fading settings
# ------------------------------
fading = true;
# Lower fade-in/out step means more gradual fading; adjust these values if needed:
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;    # Time (ms) between fade steps

# ------------------------------
# Shadows
# ------------------------------
shadow = true;
shadow-radius = 11;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-opacity = 0.45;

# ------------------------------
# Animations for window open/close
# ------------------------------
animation = true;

# ------------------------------
# General Options
# ------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
dbe = false;
unredir-if-possible = true;
=======
# Blur
blur:
{
  method = "dual_kawase";
  strength = 3;
  kern = "3x3box";
}

# Basic settings
backend = "glx";
use-damage = true;
vsync = true;

# Enable remote control via D-Bus
dbus = true;

# Detect features
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# ------------------------------
# GLX backend options
# ------------------------------
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
glx-no-rebind-pixmap = true;

# ------------------------------
# Border Radius and Rounded Corners
# ------------------------------
corner-radius = 30;
rounded-corners-exclude = [
    "name = 'xmobar'",
    "class_g = 'xmonad'",
    "class_g = 'xmobar'",
    "class_g = 'tooltip'"
];

# ------------------------------
# Opacity rules (example; adjust as needed)
# ------------------------------
opacity-rule = [
    # "100:class_g = 'YourApp'"   # Uncomment and adjust for specific apps
];

# ------------------------------
# Window types settings
# ------------------------------
wintypes: {
    normal  = { blur-background = true; };
    splash  = { blur-background = false; };
};

# ------------------------------
# Exclusions for Shadows & Blur Background
# ------------------------------
shadow-exclude = [
    "class_g = 'popup'",
    "class_g = 'dropdown-menu'",
    "class_g = 'dropdown'",
    "class_g = 'popup-menu'",
    "class_g = 'notify-osd'",
    "class_g = 'conky'",
    "_GTK_FRAME_EXTENTS@:c"
];

blur-background-exclude = [
    "class_g = 'slop'",
    "name *= 'rect-overlay'",
    "class_g = 'teams'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'popup'",
    "class_g = 'dropdown-menu'",
    "class_g = 'dropdown'",
    "class_g = 'popup-menu'"
];

# ------------------------------
# Specific Rules for Applications and Window Types
# ------------------------------
rules: (

    {
        blur-background = false;
        fade = false;
    },

    {
        match = "window_type = 'normal'";
        fade = true;    # Enable fade for normal windows
        shadow = true;  # Enable shadows for normal windows
    },

    {
        match = "window_type = 'dialog'";
        shadow = true;
    },

    {
        match = "window_type = 'tooltip'";
        corner-radius = 0;
        opacity = 0.90;
    },

    {
        match = "window_type = 'dock'";
        corner-radius = 0;
        fade = true;
    },

    {
        match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
        corner-radius = 0;
    },

    {
        match = "class_g = 'Alacritty' || class_g = 'kitty' || class_g = 'FloaTerm'";
        opacity = 1.0;
        blur-background = false;
    },

    {
        match = "class_g = 'Scratch' || class_g = 'Updating'";
        opacity = 0.93;
        blur-background = false;
    },

    {
        match = "class_g = 'Polybar' || class_g = 'eww-bar' || class_g = 'Viewnior' || class_g = 'Rofi' || class_g = 'mpv' || class_g = 'scratch' || class_g = 'Dunst' || class_g = 'retroarch'";
        corner-radius = 0;
    },

    {
        match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst' || class_g = 'Polybar' || class_g = 'Eww' || class_g = 'jgmenu' || class_g = 'scratch' || class_g = 'Spotify' || class_g = 'retroarch' || class_g = 'firefox' || class_g = 'Rofi' || class_g = 'Screenkey' || class_g = 'mpv' || class_g = 'Viewnior' || _GTK_FRAME_EXTENTS@";
        shadow = false;
    },

    @include "picom-animations.conf"
