# Backend & basics
backend = "glx";
vsync = true;
use-damage = true;
dbus = true;

# Blur
blur = {
  method = "dual_kawase";
  strength = 3;
  kern = "3x3box";
};


# --------- Per-window rules (new style only) ---------
rules = (
  # Default (keep first in this list)
  {
    shadow = true;
    fade = true;
    corner-radius = 30;
    opacity = 1.0;
  },

  # Screenshot selector (maim/slop overlay) — keep crisp
  {
    match = "class_g = 'slop' || name *= 'rect-overlay'";
    blur-background = false;
    shadow = false;
    corner-radius = 0;
    opacity = 1.0;
    override = true;
  },

  # Bars / menus — no blur
  {
    match = "class_g = 'Rofi' || class_g = 'dmenu' || class_g = 'xmobar' || class_g = 'Polybar'";
    blur-background = false;
    shadow = false;
    override = true;
  },

  # GTK frame extents helper windows — no blur
  {
    match = "_GTK_FRAME_EXTENTS@:c";
    blur-background = false;
    shadow = false;
    override = true;
  },

  # Tooltips / Xmonad helpers
  {
    match = "class_g = 'tooltip' || class_g = 'xmonad'";
    corner-radius = 10;
    blur-background = false;
    shadow = false;
    fade = true;
    override = true;
  },

  # Terminals
  {
    match = "class_g = 'kitty' || class_g = 'alacritty' || class_g = 'Alacritty' || class_g = 'FloatTerm'";
    opacity = 0.95;
    blur-background = true;
    corner-radius = 20;
    override = true;
  },

  # Vim
  {
    match = "class_g = 'vim'";
    corner-radius = 15;
    fade = true;
    shadow = true;
    opacity = 1.0;
    blur-background = false;   # sharper text
    override = true;
  },

  # Emacs
  {
    match = "name = 'emacs' || class_g = 'emacs'";
    corner-radius = 30;
    fade = true;
    shadow = true;
    blur-background = false;   # sharper text
    override = true;
  },

  # Chromium
  {
    match = "class_g = 'Chromium'";
    corner-radius = 25;
    opacity = 1.0;
    override = true;
  },

  # Notifications
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst'";
    shadow = false;
    blur-background = false;
    override = true;
  },

  # --- animation rules appended via include ---
  @include "picom-animations.conf"
);

# Optional perf toggles
unredir-if-possible = true;  # Unredirect fullscreen windows for better performance and screenshot clarity
# xrender-sync-fence = true;
