# Blur
blur:
{
  method = "dual_kawase";
  strength = 2;
  kern = "3x3box";
}

# Basic settings
backend = "glx";
use-damage = true;
vsync = true;

# Enable remote control via D-Bus
dbus = true;

# Detect features
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Shadows
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

# Opacity
# frame-opacity = 1.0;

# Enable animations
animation = true;
## Border radius
corner-radius=30;

rounded-corners-exclude = [
  "name = 'xmobar'",
  "class_g = 'xmonad'",
  "class_g = 'xmobar'",
  "class_g = 'tooltip'"
];

# Window rules
rules = (

  # Xmobar
  {
    match = (
      "name = 'xmobar' ||
      name = 'xmobar' ||
      class_g = 'xmonad' ||
      class_g = 'xmobar' ||
      class_g = 'tooltip'"
    );
    corner-radius = 10;
    fade = true;
    shadow = false;
    blur-background = false;
    override = true;
  },

  {
    match = "class_g = 'kitty'";
    opacity = 0.9;
    blur-background = true;
    corner-radius = 20;
    override = true;  # Force this rule to take precedence
  },



  # Default settings for all windows (must be first)
  {
    shadow = true;
    fade = true;
    corner-radius = 30;  # Default corner radius for unspecified windows
    opacity = 1.0;
  },


  # Normal windows
  {
    match = "window_type = 'normal'";
    corner-radius = 30;
    override = true;
  },



  # Cursor - no corner radius or effects
  {
    match = "class_g = 'cursor'";
    corner-radius = 0;
    fade = false;
    shadow = false;
    override = true;
  },


  # Vim
  {
    match = (
      "class_g = 'vim'"
    );
    corner-radius = 15;
    fade = true;
    shadow = true;
    opacity = 1.0;
    blur-background = false;  # Better for text editors
    override = true;
  },

  # Kitty terminal

  # Other terminals
  {
    match = "class_g = 'Alacritty' || class_g = 'FloaTerm'";
    opacity = 1.0;
    blur-background = false;
  },

  # Rofi
  {
    match = "class_g = 'Rofi'";
    corner-radius = 20;
    override = true;  # Force this rule to take precedence
  },

  # Chromium
  {
    match = "class_g = 'Chromium'";
    corner-radius = 25;
    override = true;  # Force this rule to take precedence
    opacity = 1.0;
  },

  # Emacs
  {
    match = ("name = 'emacs' || class_g = 'emacs'");
    # override = false;
    corner-radius = 30;
    fade = true;
    shadow = true;
    # opacity = 0.98;
    blur-background = true;  # Better for text editors
    inherit-background = true;
  },

  # No shadows for notifications etc
  {
    match = (
      "name = 'Notification' || "
      "class_g ?= 'Notify-osd' || "
      "class_g = 'Dunst' || "
      "class_g = 'Polybar' || "
      "_GTK_FRAME_EXTENTS@"
    );
    shadow = false;
  },


  @include "picom-animations.conf"
)

blur-background-exclude = [
  "class_g = 'slop'",
  "name *= 'rect-overlay'",
  "class_g = 'teams'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'popup'",
  "class_g = 'dropdown-menu'",
  "class_g = 'dropdown'",
  "class_g = 'popup-menu'"
];
