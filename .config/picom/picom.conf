# Backend & basics
backend = "glx";
vsync = true;
use-damage = true;
dbus = true;

# Blur (parameters only — per-window toggle via rules below)
blur-method = "dual_kawase";
blur-strength = 3;

# --------- Per-window rules (new style only) ---------
rules: ({
  # Screenshot selector (slop overlay) — no blur, no decorations
  match = "class_g = 'slop' || class_i = 'slop'";
  blur-background = false;
  shadow = false;
  corner-radius = 0;
  opacity = 1.0;
}, {
  # Default — blur off (only terminals opt in)
  shadow = true;
  fade = true;
  corner-radius = 30;
  opacity = 1.0;
}, {
  # Bars / menus — no blur
  match = "class_g = 'Rofi' || class_g = 'dmenu' || class_g = 'xmobar' || class_g = 'Polybar'";
  blur-background = false;
  shadow = false;
}, {
  # GTK frame extents helper windows — no blur
  match = "_GTK_FRAME_EXTENTS@";
  blur-background = false;
  shadow = false;
}, {
  # Tooltips / Xmonad helpers
  match = "class_g = 'tooltip' || class_g = 'xmonad'";
  corner-radius = 10;
  blur-background = false;
  shadow = false;
  fade = true;
}, {
  # Terminals
  match = "class_g = 'kitty' || class_g = 'alacritty' || class_g = 'Alacritty' || class_g = 'FloatTerm'";
  opacity = 0.95;
  blur-background = true;
  corner-radius = 20;
}, {
  # Vim
  match = "class_g = 'vim'";
  corner-radius = 15;
  fade = true;
  shadow = true;
  opacity = 1.0;
  blur-background = false;
}, {
  # Emacs
  match = "name = 'emacs' || class_g = 'emacs'";
  corner-radius = 30;
  fade = true;
  shadow = true;
  opacity = 0.95;
  blur-background = true;
}, {
  # Chromium
  match = "class_g = 'Chromium'";
  corner-radius = 25;
  opacity = 1.0;
}, {
  # Notifications
  match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst'";
  shadow = false;
  blur-background = false;
},
  # --- animation rules appended via include ---
  @include "picom-animations.conf"
)

# Optional perf toggles
unredir-if-possible = true;
