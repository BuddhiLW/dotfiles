# Window rules
rules = (
  {
    match = "class_g = 'kitty'";
    opacity = 0.9;
    blur-background = true;
    corner-radius = 20;
    override = true;  # Force this rule to take precedence
  },



  # Default settings for all windows (must be first)
  {
    shadow = true;
    fade = true;
    corner-radius = 30;  # Default corner radius for unspecified windows
    opacity = 1.0;
  },


  # Normal windows
  {
    match = "window_type = 'normal'";
    corner-radius = 30;
    override = true;
  },



  # Cursor - no corner radius or effects
  {
    match = "class_g = 'cursor'";
    corner-radius = 0;
    fade = false;
    shadow = false;
    override = true;
  },


  # Vim
  {
    match = (
      "class_g = 'vim'"
    );
    corner-radius = 15;
    fade = true;
    shadow = true;
    opacity = 1.0;
    blur-background = false;  # Better for text editors
    override = true;
  },


  # Rofi
  {
    match = "class_g = 'Rofi'";
    corner-radius = 20;
    override = true;  # Force this rule to take precedence
  },

  # Chromium
  {
    match = "class_g = 'Chromium'";
    corner-radius = 25;
    override = true;  # Force this rule to take precedence
    opacity = 1.0;
  },

  # Emacs
  {
    match = ("name = 'emacs' || class_g = 'emacs'");
    # override = false;
    corner-radius = 30;
    fade = true;
    shadow = true;
    # opacity = 0.98;
    blur-background = true;  # Better for text editors
    inherit-background = true;
  },


  # No shadows for notifications etc
  {
    match = (
      "name = 'Notification' || "
      "class_g ?= 'Notify-osd' || "
      "class_g = 'Dunst' || "
      "class_g = 'Polybar' || "
      "_GTK_FRAME_EXTENTS@"
    );
    shadow = false;
  },

  # Xmobar
  {
    match = (
      "class_g = 'xmobar'"
    );
    corner-radius = 0;
    fade = true;
    shadow = false;
    blur-background = false;
    override = false;
  },

  # Xmonad
  {
    match = (
    "class_g = 'xmonad' ||
    class_g = 'tooltip'"
    );
    corner-radius = 10;
    fade = true;
    shadow = false;
    blur-background = false;
    override = false;
  },

  # Kitty terminal

  # Other terminals
  {
    match = "class_g = 'kitty' || class_g = 'alacritty' || class_g = 'Alacritty' || class_g = 'FloatTerm'";
    opacity = 1.0;
    blur-background = true;
  },

  @include "picom-animations.conf"
)

