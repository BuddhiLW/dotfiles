# Blur
blur:
{
method = "dual_kawase";
# method = "gaussian";
strength = 5;
# kernel = "7,7,0.000003,0.000102,0.000849,0.001723,0.000849,0.000102,0.000003,0.000102,0.003494,0.029143,0.059106,0.029143,0.003494,0.000102,0.000849,0.029143,0.243117,0.493069,0.243117,0.029143,0.000849,0.001723,0.059106,0.493069,0.493069,0.059106,0.001723,0.000849,0.029143,0.243117,0.493069,0.243117,0.029143,0.000849,0.000102,0.003494,0.029143,0.059106,0.029143,0.003494,0.000102,0.000003,0.000102,0.000849,0.001723,0.000849,0.000102,0.000003"


# method = "gaussian";
# size = 13;
# deviation = 5.5;
}


# Fading
# Enable fading for windows
fading = true;

# Duration of fading animations in milliseconds
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10

# Enable shadows if you want to have shadows on terminals
shadow = true;
shadow-radius = 11;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-opacity = 0.45;
# shadow-opacity = 0.4;  # Adjust opacity as needed
# shadow-offset-x = 1.1;
# shadow-offset-y = 1;
# shadow-radius = 1;
# shadow-color = "#777777"

# Enable animations for opening/closing windows
animation = true;

# Other
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# refresh-rate = 0;
dbe = false;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];

# GLX backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true
glx-no-rebind-pixmap = true;

# General settings
#backend = "xrender";
#vsync = true;

## Border radius
corner-radius=30;

rounded-corners-exclude = [
  "name = 'xmobar'",
  "class_g = 'xmonad'",
  "class_g = 'xmobar'",
  "class_g = 'tooltip'"
];
#
# round-borders = 10;
# round-borders-rule = [
#   "0:name     = 'xmobar'",
#   "0:name     = 'firefox'",
# 	"0:class_g = 'Xmobar'"
# ];

opacity-rule = [
    #"50:class_g = 'xmobar'",
    #"50:name = 'xmobar'"
];

wintypes:
{
 normal = { blur-background = true; };
 splash = { blur-background = false; };
};

shadow-exclude = [
  "class_g = 'popup'",
  "class_g = 'dropdown-menu'",
  "class_g = 'dropdown'",
  "class_g = 'popup-menu'",
  "class_g = 'notify-osd'",
  "class_g = 'conky'",
  "_GTK_FRAME_EXTENTS@:c"
];

blur-background-exclude = [
  "class_g = 'slop'",
  "name *= 'rect-overlay'",
  "class_g = 'teams'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'popup'",
  "class_g = 'dropdown-menu'",
  "class_g = 'dropdown'",
  "class_g = 'popup-menu'"
];

rules: (

	{
		blur-background = false;
		fade = false;
	},

	{
		match = "window_type = 'normal'";
		fade = true;	#-fade-switch
		shadow = true;	#-shadow-switch
	},

	{
		match = "window_type = 'dialog'";
		shadow = true;	#-shadow-switch
	},

	{
		match = "window_type = 'tooltip'";
		corner-radius = 0;
		opacity = 0.90;
	},

	{
		match = "window_type = 'dock'";
		corner-radius = 0;
		fade = true;
	},

	{
		match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
		corner-radius = 0;
	},

	{
		match = "class_g = 'Alacritty'	|| class_g = 'kitty' || class_g = 'FloaTerm'";
		opacity = 1.0;	#-term-opacity-switch
		blur-background = false;	#-blur-switch
	},

	{
		match = "class_g = 'Scratch' || class_g = 'Updating'";
		opacity = 0.93;
		blur-background = false;	#-blur-switch
	},

	{
		match = "class_g = 'Polybar'	|| "
				"class_g = 'eww-bar'	|| "
				"class_g = 'Viewnior'	|| "
				"class_g = 'Rofi'		|| "
				"class_g = 'mpv'		|| "
				"class_g = 'scratch'	|| "
				"class_g = 'Dunst'		|| "
				"class_g = 'retroarch'";
		corner-radius = 0;
	},

	{
		match = "name = 'Notification'		|| "
				"class_g ?= 'Notify-osd'    || "
				"class_g = 'Dunst'			|| "
				"class_g = 'Polybar'		|| "
				"class_g = 'Eww'			|| "
				"class_g = 'jgmenu'			|| "
				"class_g = 'scratch'		|| "
				"class_g = 'Spotify'		|| "
				"class_g = 'retroarch'		|| "
				"class_g = 'firefox'		|| "
				"class_g = 'Rofi'			|| "
				"class_g = 'Screenkey'		|| "
				"class_g = 'mpv'			|| "
				"class_g = 'Viewnior'		|| "
				"_GTK_FRAME_EXTENTS@";
		shadow = false;
	},

@include "picom-animations.conf"

)
