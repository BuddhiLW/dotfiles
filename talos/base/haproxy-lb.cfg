## blw kube-apiserver LB — served at 127.0.0.1:16443
##
## Preference order: T320 (ECC + PLP, enterprise SSD) is the sole active server.
## MPC1 / MPC2 / ClusterIP are backups, round-robined together via `option allbackups`
## once T320 is down. Off-LAN, the two direct LAN backends health-check DOWN and the
## ClusterIP-via-tailnet backend is the only survivor — ordering falls out of the checks.
##
## Backends are reached over their LAN IPs; kubectl targets 127.0.0.1, which is present
## in every CP's apiserver cert SAN list, so TLS verification stays on end-to-end
## (mode tcp = passthrough, HAProxy never terminates TLS).

global
  log stdout format raw local0
  maxconn 2048
  # Runtime API on loopback TCP (a bind-mounted unix socket is refused under this
  # docker setup). Drain a CP before upgrading it:
  #   echo "set server kubernetes_control_planes/t320 state maint" | socat stdio tcp:127.0.0.1:8406
  #   echo "set server kubernetes_control_planes/t320 state ready" | socat stdio tcp:127.0.0.1:8406
  stats socket 127.0.0.1:8406 level admin
  stats timeout 30s

defaults
  log global
  mode tcp
  option dontlognull
  # Long-lived kubectl watches, exec, port-forward and logs -f must not be reaped.
  timeout connect 5s
  timeout client 4h
  timeout server 4h
  timeout tunnel 4h
  timeout check 3s
  retries 3
  # Retry a failed connection against a DIFFERENT server rather than the same one.
  option redispatch

frontend kubernetes_api
  bind 127.0.0.1:16443
  default_backend kubernetes_control_planes

backend kubernetes_control_planes
  balance roundrobin
  # Use every backup at once instead of only the first available one.
  option allbackups
  # /readyz answers 401 unauthenticated on this cluster; either code proves the
  # apiserver HTTP mux is live, which a bare TCP connect does not.
  option httpchk GET /readyz
  http-check expect rstatus ^(200|401)$
  default-server check check-ssl verify none inter 5s fall 3 rise 2 downinter 10s

  # PRIMARY — Dell T320 (talos-l1m-v82), Talos v1.13.7, ECC RAM + PLP SSD RAID1
  server t320 192.168.100.137:6443

  # BACKUPS — mini PCs (consumer NVMe, no ECC/PLP)
  server mpc1 192.168.100.133:6443 backup
  server mpc2 192.168.100.134:6443 backup

  # LAST RESORT — kubernetes ClusterIP via the tailnet subnet router.
  # Only route that survives off-LAN; kube-proxy picks the CP behind it.
  server csvc 10.96.0.1:443 backup

frontend stats
  bind 127.0.0.1:8405
  mode http
  stats enable
  stats uri /stats
  stats refresh 5s
