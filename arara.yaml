name: dotfiles
description: BLW's dotfiles configuration
namespace: blw
env:
  DOTFILES: $HOME/dotfiles
  GITTHINGS: $DOTFILES/gitthings
  SCRIPTS: $DOTFILES/scripts
setup:
  backup_dirs:
    - $HOME/.config
    - $HOME/.local
  core_links:
    - source: $DOTFILES/.config
      target: $HOME/.config
    - source: $DOTFILES/.local
      target: $HOME/.local
  config_links:
    - source: $DOTFILES/.bashrc
      target: $HOME/.bashrc
    - source: $DOTFILES/.vim
      target: $HOME/.vim
    - source: $DOTFILES/.config/vim/.vimrc
      target: $HOME/.vimrc
build:
  steps:
    - name: backup
      description: Backup existing dotfiles
      command: arara setup backup
    - name: link
      description: Create symlinks
      command: arara setup link
    - name: source-bashrc
      description: Source updated bashrc
      command: source $HOME/.bashrc
    - name: main-install
      description: Install core packages and tools
      commands:
        - bash $DOTFILES/scripts/install/make-deps
        - bash $DOTFILES/scripts/install/install-deps
        - bash $DOTFILES/scripts/install/go
        - bash $DOTFILES/scripts/install/st
        - bash $DOTFILES/scripts/install/doom
        - bash $DOTFILES/scripts/install/ble
        - bash $DOTFILES/scripts/install/anaconda
        - bash $DOTFILES/scripts/install/pywal
        - bash $DOTFILES/scripts/install/pomodoro
        - bash $DOTFILES/scripts/install/keg
        - bash $DOTFILES/scripts/install/libxft-bgra
        - bash $DOTFILES/scripts/install/joypixels
        - bash $DOTFILES/scripts/install/mongo
        - bash $DOTFILES/scripts/install/npm-global
    - name: update-font-cache
      description: Make newly installed fonts available
      command: fc-cache -vf
    - name: xmonad-setup
      description: Setup XMonad window manager
      command: bash $DOTFILES/scripts/setup/xmonad
    - name: xmonad-install
      description: Install XMonad
      command: bash $DOTFILES/scripts/install/xmonad
    - name: completion-message
      description: Display completion message
      commands:
        - echo "Congrats. If everything went well, you have the newest Buddhi WM installed."
        - echo "New step, you can logout from your current Ubuntu session, and chose XMonad,"
        - echo "instead of GNOME Window Manager. This choice is generally done at the login"
        - echo "interface."
